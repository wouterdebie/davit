name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Only booleans here. A secret declared at workflow level is readable by
# EVERY step, including `swift build` (SwiftPM plugins run arbitrary code) and
# every third-party action. These flags carry the same gating information with
# none of the exposure; the values themselves are attached to the single step
# that consumes each one.
env:
  # Switches the pipeline to Developer ID signing + notarization; without it,
  # builds are ad-hoc signed.
  HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
  # Enables the Homebrew tap bump after release.
  HAS_TAP: ${{ secrets.TAP_PUSH_TOKEN != '' }}
  # Enables publishing the legacy appcast.json to davit.app after release.
  HAS_GCS: ${{ secrets.GCS_SA_KEY != '' }}
  # Enables signing the Sparkle appcast. Without it the release still publishes,
  # but no Sparkle client will accept the update.
  HAS_SPARKLE: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}

jobs:
  # Compiles. Holds no credentials of any kind, deliberately: `swift build`
  # resolves and compiles apple/container, containerization, swift-nio, Yams and
  # their transitive tree, and runs five SwiftPM build plugins, all of which
  # execute arbitrary code. Scoping secrets to steps is not enough when the
  # untrusted code is in the same job, so the signing keys live in `release`.
  build:
    # Apple silicon runner; the apple/container dependency needs Swift 6.2+
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build app bundle without release secrets
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          scripts/bundle.sh   # CODESIGN_IDENTITY unset -> ad-hoc; release job re-signs

      - name: Package the bundle and the Sparkle tools
        run: |
          # ditto, not upload-artifact on the .app: Sparkle.framework is a
          # versioned bundle of symlinks, and the artifact upload flattens them,
          # which breaks `codesign --verify --deep` only at install time.
          mkdir -p handoff
          ditto -c -k --sequesterRsrc --keepParent dist/Davit.app handoff/Davit-unsigned.zip
          # generate_appcast and sign_update ship in the SPM artifact bundle. The
          # release job does not build, so carry them rather than re-resolving.
          ditto -c -k --keepParent .build/artifacts/sparkle/Sparkle/bin handoff/sparkle-tools.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-bundle
          path: handoff/
          retention-days: 1

  # Holds every credential. Runs no build: it unpacks what `build` produced,
  # signs it, notarizes it, and publishes.
  release:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      # v8 defaults `digest-mismatch` to error rather than warn. That matters
      # here specifically: this job signs and notarizes a bundle it did not
      # build, so a corrupted handoff should fail loudly, not get a signature.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: unsigned-bundle
          path: handoff

      - name: Unpack the bundle and tools
        run: |
          mkdir -p dist "$RUNNER_TEMP/sparkle-tools"
          ditto -x -k handoff/Davit-unsigned.zip dist
          ditto -x -k handoff/sparkle-tools.zip "$RUNNER_TEMP/sparkle-tools"
          test -d dist/Davit.app
          test -x "$RUNNER_TEMP/sparkle-tools/bin/generate_appcast"

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PWD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain-db
          security set-keychain-settings -lut 21600 build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain-db
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain-db -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm cert.p12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" build.keychain-db
          security list-keychains -d user -s build.keychain-db login.keychain-db
          IDENTITY_LINE=$(security find-identity -v -p codesigning build.keychain-db \
            | grep "Developer ID Application" | head -1)
          FINGERPRINT=$(echo "$IDENTITY_LINE" \
            | sed -E 's/^[[:space:]]*[0-9]+\)[[:space:]]+([0-9A-F]+).*/\1/')
          # Two Developer ID certificates can carry an IDENTICAL common name, so
          # the name says nothing about which private key is about to sign. Pin
          # the fingerprint instead: exporting the wrong cert from Keychain
          # Access then fails the build loudly rather than shipping quietly.
          # On rotation, update this and the copy in scripts/sign.sh.
          EXPECTED_CERT_SHA1="89AFE2B56FFCB7344A7600B5E38E97C68A544591"
          if [ "$FINGERPRINT" != "$EXPECTED_CERT_SHA1" ]; then
            echo "Signing certificate is not the expected one." >&2
            echo "  expected: $EXPECTED_CERT_SHA1" >&2
            echo "  imported: $FINGERPRINT" >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$FINGERPRINT" >> "$GITHUB_ENV"
          echo "Using identity: $FINGERPRINT"

      - name: Sign
        run: scripts/sign.sh dist/Davit.app

      - name: Notarize
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          ditto -c -k --keepParent "dist/Davit.app" "notarize.zip"
          scripts/notarize.sh notarize.zip dist/Davit.app
          rm notarize.zip

      - name: Zip app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Its own directory: generate_appcast scans a folder, and must see the
          # zip without the DMG.
          mkdir -p dist/release
          ditto -c -k --sequesterRsrc --keepParent "dist/Davit.app" "dist/release/Davit-${VERSION}.zip"
          # Run from inside the directory so the checksum file names the archive,
          # not a path — that is what users compare against.
          ( cd dist/release && shasum -a 256 "Davit-${VERSION}.zip" > "Davit-${VERSION}.zip.sha256" )
          cp "dist/release/Davit-${VERSION}.zip" "Davit-${VERSION}.zip"
          cp "dist/release/Davit-${VERSION}.zip.sha256" "Davit-${VERSION}.zip.sha256"

      # The zip stays the machine channel (Sparkle, Homebrew cask);
      # the DMG is the human one — mount, drag Davit to Applications.
      - name: Build DMG
        run: |
          brew install create-dmg || echo "create-dmg unavailable — plain hdiutil layout"
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/make-dmg.sh dist/Davit.app "Davit-${VERSION}.dmg"
          if [ "$HAS_SIGNING" = "true" ]; then
            codesign --force --timestamp -s "$CODESIGN_IDENTITY" "Davit-${VERSION}.dmg"
          fi

      - name: Notarize DMG
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: scripts/notarize.sh "Davit-${GITHUB_REF_NAME#v}.dmg"

      - name: Checksum DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          shasum -a 256 "Davit-${VERSION}.dmg" > "Davit-${VERSION}.dmg.sha256"

      # Before the key is ever used: confirm its public half is the
      # SUPublicEDKey already baked into the bundle we just signed. Sparkle has
      # no key list and no rotation path, so signing with the wrong key ships an
      # update that every installed copy rejects, with no way to route those
      # users back. Cheaper to fail the release here than to strand them.
      - name: Check the Sparkle key matches the bundle
        if: env.HAS_SPARKLE == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set +x
          set -euo pipefail
          : "${SPARKLE_PRIVATE_KEY:?Missing SPARKLE_PRIVATE_KEY}"
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            env -u SPARKLE_PRIVATE_KEY scripts/check-signing-key.sh dist/Davit.app

      - name: Sign the Sparkle appcast
        if: env.HAS_SPARKLE == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set +x
          set -euo pipefail
          : "${SPARKLE_PRIVATE_KEY:?Missing SPARKLE_PRIVATE_KEY}"
          VERSION="${GITHUB_REF_NAME#v}"
          # The key goes in on stdin and is stripped from the tool's own
          # environment, so it is never readable from /proc or a crash dump.
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            env -u SPARKLE_PRIVATE_KEY "$RUNNER_TEMP/sparkle-tools/bin/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/wouterdebie/davit/releases/download/${GITHUB_REF_NAME}/" \
              --maximum-deltas 0 \
              dist/release
          test -s dist/release/appcast.xml
          # Verify what we just produced rather than trusting the exit code: a
          # missing signature would publish an appcast no client can accept.
          SIGNATURE="$(xmllint --xpath 'string(/rss/channel/item/enclosure/@*[local-name()="edSignature"])' dist/release/appcast.xml)"
          test -n "$SIGNATURE"
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            env -u SPARKLE_PRIVATE_KEY "$RUNNER_TEMP/sparkle-tools/bin/sign_update" \
              --ed-key-file - --verify "dist/release/Davit-${VERSION}.zip" "$SIGNATURE"
          cp dist/release/appcast.xml appcast.xml

      - name: Write release notes
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            cat > RELEASE_NOTES.md <<'NOTES'
          ## Install

          Download the DMG below, open it, and drag Davit to Applications.
          This build is Developer ID signed and notarized — it opens like any
          other app. (The zip is the same app; it's what the in-app updater
          and Homebrew use.)

          Requires an Apple silicon Mac. On first launch Davit offers to install
          Apple's container platform if it isn't present (no admin rights needed).
          NOTES
          else
            cat > RELEASE_NOTES.md <<'NOTES'
          ## Install

          1. Download the DMG below, open it, and drag Davit to Applications
             (or use the zip — same app).
          2. This build is not notarized (ad-hoc signature), so macOS will refuse to
             open it until you clear the quarantine flag:

             ```sh
             xattr -dr com.apple.quarantine /Applications/Davit.app
             ```

          Requires an Apple silicon Mac. On first launch Davit offers to install
          Apple's container platform if it isn't present (no admin rights needed).
          NOTES
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            Davit-*.dmg
            Davit-*.dmg.sha256
            Davit-*.zip
            Davit-*.zip.sha256
            appcast.xml
          generate_release_notes: true
          body_path: RELEASE_NOTES.md

      # macOS runners have no Google Cloud SDK; these two actions provide
      # credentials + gsutil for the appcast upload.
      - name: Authenticate to GCS
        if: env.HAS_GCS == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCS_SA_KEY }}

      - name: Set up gcloud
        if: env.HAS_GCS == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      # The legacy feed, kept for clients older than the Sparkle switchover.
      # Anyone on <= 0.1.33 polls this and knows nothing about appcast.xml; drop
      # it and they never learn another version exists. They take one more update
      # through the old path, land on a Sparkle build, and switch feeds for good.
      # Safe to retire once nobody is plausibly still on an older build.
      - name: Publish legacy appcast.json to davit.app
        if: env.HAS_GCS == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > appcast.json <<EOF
          {
            "version": "${VERSION}",
            "downloadURL": "https://github.com/wouterdebie/davit/releases/download/v${VERSION}/Davit-${VERSION}.zip",
            "releasePageURL": "https://github.com/wouterdebie/davit/releases/tag/v${VERSION}"
          }
          EOF
          gsutil -h "Cache-Control:no-cache" cp appcast.json gs://davit-app/appcast.json

      - name: Bump Homebrew tap
        if: env.HAS_TAP == 'true'
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(cut -d' ' -f1 "Davit-${VERSION}.zip.sha256")
          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/wouterdebie/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/version \"[0-9.]+\"/version \"${VERSION}\"/" Casks/davit.rb
          sed -i '' -E "s/sha256 \"[0-9a-f]+\"/sha256 \"${SHA}\"/" Casks/davit.rb
          git config user.name "davit-release"
          git config user.email "noreply@davit.app"
          git commit -am "davit ${VERSION}"
          git push

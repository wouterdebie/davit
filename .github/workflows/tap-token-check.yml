name: Tap token check

# Temporary. Proves TAP_PUSH_TOKEN can still authenticate and write to the
# Homebrew tap, without cutting a release. Creates a throwaway branch in the
# tap and deletes it again, so main is never touched.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the tap with TAP_PUSH_TOKEN
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          if [ -z "$TAP_PUSH_TOKEN" ]; then
            echo "FAIL: TAP_PUSH_TOKEN secret is empty or unset"; exit 1
          fi
          git clone --quiet \
            "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/wouterdebie/homebrew-tap.git" tap
          echo "clone: OK (token authenticates for read)"

      - name: Prove write access via a throwaway branch
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        working-directory: tap
        run: |
          BR="tap-token-check-${GITHUB_RUN_ID}"
          if git push --quiet origin "HEAD:refs/heads/${BR}"; then
            echo "push: OK (token can write)"
          else
            echo "FAIL: token cannot write to the tap"; exit 1
          fi
          git push --quiet origin --delete "${BR}" && echo "cleanup: branch removed"

      - name: Confirm the cask is intact and readable
        working-directory: tap
        run: |
          grep -E '^\s+version "' Casks/davit.rb
          test ! -e .vscode -a ! -e public && echo "payload: absent, as expected"
